name: Deploy documentations

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

jobs:
  build_and_deploy:
    runs-on: self-hosted
    steps:
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y awscli
          sudo apt autoremove -y
          sudo apt autoclean -y

      - uses: actions/checkout@v4
      - name: Generate new version
        run: |
          python3 get-version.py --branch=${{ github.ref_name }} --outfile=version.txt
          echo "Building version: $(cat version.txt)"

      - name: Generate .env
        run: |
          echo "Step to generate .env file"

      - name: Build and publish the image
        run: |
          docker ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin 905418344172.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          docker build -t bitswaper_frontend:latest .
          VERSION=$(cat version.txt)
          docker tag bitswaper_frontend:latest 905418344172.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/bitswaper_frontend:$VERSION
          docker push 905418344172.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/bitswaper_frontend:$VERSION

      - name: Check tag exists
        run: |
          VERSION=$(cat version.txt)
          git config --global --add safe.directory '*'
          echo "TAG_FOUND=$(git tag -l $VERSION)" >> $GITHUB_ENV

      - name: Tag the new version
        if: ${{ env.TAG_FOUND == '' }}
        run: |
          VERSION=$(cat version.txt)
          git config --global --add safe.directory '*'
          git config --global user.email "admin@hctechsolutions.com.br"
          git config --global user.name "hctech-solutions"
          git tag -a "$VERSION" -m "$VERSION"
          git remote -v
          git push origin ${{ github.ref_name }} --tags
          echo "Version $VERSION tagged and pushed to repository"
