name: Nebula CI/CD

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: forge build
        id: build

      - name: Run Forge tests
        run: forge test
        id: test

  docs:
    name: Provide documentation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge docs
        run: forge doc --build
        id: doc

      - name: Archive documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/  # 🔥 Garante que toda a pasta `docs/` seja salva

  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y curl unzip
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Download documentation artifacts
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: .

      - name: Verificar estrutura dos arquivos baixados
        run: ls -lR docs/

      - name: Build and publish documentation
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin 905418344172.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          docker build -t docs:latest .
          docker tag docs:latest 905418344172.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/docs:latest
          docker push 905418344172.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/docs:latest
