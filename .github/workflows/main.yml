name: Evx Core CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: forge build
        id: build

      - name: Check EvxPool deployed size
        run: sh script/check-evxpool-size.sh

      - name: Run Forge tests
        run: forge test
        id: test
