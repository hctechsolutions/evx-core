name: Nebula CI/CD

on:
  push:
    branches:
      - main
      - develop

env:
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge build
        run: forge build
        id: build

      - name: Run Forge tests
        run: forge test
        id: test

  docs:
    name: Provide documentation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge docs
        run: forge doc --build
        id: doc

      - name: Archive documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-docs
          path: docs/book/
  
  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@v4
        with:
          name: forge-docs
          path: docs/book/

      - name: Build and publish documentations
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin 905418344172.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
          docker build -t docs:latest .
          docker tag docs:latest 905418344172.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/docs:latest
          docker push 905418344172.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/docs:latest
